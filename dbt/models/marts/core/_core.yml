version: 2

models:
  - name: dim_issue_taxonomy
    description: >
      I built this to see how many distinct product x sub_product x issue x
      sub_issue combinations the source actually publishes, since CFPB's own
      taxonomy has changed across the archive's 15-year history. I expected
      some legacy/current overlap. What I found: 2,642 distinct
      combinations — far more than the 21 top-level products alone would
      suggest — and legacy and current labels (two different "Credit
      reporting" product names, for one) sit side by side rather than being
      merged, because merging them would silently rewrite what CFPB actually
      published.
    columns:
      - name: issue_taxonomy_key
        description: Deterministic surrogate key over the four taxonomy fields.
        tests: [unique, not_null]
      - name: product
        tests: [not_null]
      - name: issue
        tests: [not_null]

  - name: fct_complaints
    description: >
      This is where I go to answer "how many complaints, and how healthy is
      the record" at the population level — one row per published complaint
      record, and a row is a complaint observation, never a customer, a
      consumer profile, or an identified person. I hypothesized the vast
      majority of rows would be decision-ready. What I found: 93.8% carry
      COMPLETE data and 99.4% show a timely published response — high enough
      that I treat completeness as a rate to monitor over time, not a queue
      to triage record by record.
    columns:
      - name: complaint_id
        description: Canonical complaint record key. STRING, not integer.
        tests: [unique, not_null]
      - name: complaint_received_date
        tests: [not_null]
      - name: product
        tests: [not_null]
      - name: issue
        tests: [not_null]
      - name: timely_response_status
        tests:
          - accepted_values:
              arguments:
                values: ["YES", "NO", "UNKNOWN"]
              config:
                severity: warn  # UNKNOWN is currently unreachable — no null/third value exists at source
      - name: data_completeness_status
        tests:
          - accepted_values:
              arguments:
                values: ["COMPLETE", "PARTIAL", "INSUFFICIENT"]

  - name: fct_issue_daily_metrics
    description: >
      I query this to see the real trend shape over time, not a snapshot —
      one row per calendar date x product x issue, never a market-wide
      measure (docs/09_supported_vs_unsupported_metrics.md). I expected
      volume to grow roughly with the source's participation base. What I
      found: monthly volume grew from ~26K to over 700K between Jan 2020 and
      Jul 2026 — a 20x compounding rise, not a flat trend — which is also
      how I found that the original issue_volume_current field (a rolling
      window) silently inflates any multi-date total by up to 8x if you
      naively SUM() it. daily_complaint_count exists because of that finding.
    columns:
      - name: metric_date
        tests: [not_null]
      - name: product
        tests: [not_null]
      - name: issue
        tests: [not_null]
      - name: daily_complaint_count
        description: >
          The true, non-overlapping count of complaints received on this
          single date for this product x issue grain. Safe to SUM() across
          dates. Added 2026-08-16 to fix a real double-counting defect in
          the application layer, which had been summing issue_volume_current
          (a rolling window) across dates instead. See
          docs/09_supported_vs_unsupported_metrics.md §4.1.
        tests: [not_null]
      - name: issue_pattern_status
        tests:
          - accepted_values:
              arguments:
                values: ["QUALIFIED_SIGNAL", "UNQUALIFIED_SIGNAL", "INSUFFICIENT_BASELINE", "NO_SIGNAL"]
