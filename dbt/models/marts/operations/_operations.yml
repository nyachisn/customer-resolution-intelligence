version: 2

models:
  - name: resolution_action_queue
    description: >
      I look here to see what the policy layer actually decided for every
      complaint, not just the ones that got escalated — one row per
      complaint record x final recommendation run/version, and every
      non-standard action carries policy_id, reason_code, evidence_fields,
      and signal_confidence. I hypothesized most records would need no
      action. What I found: 70.7% land on STANDARD_HANDLING and only 0.5%
      reach ESCALATE_REVIEW — the policies are selective by design, not
      defaulting to alarm.
    columns:
      - name: recommendation_id
        tests: [unique, not_null]
      - name: complaint_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_complaints')
                field: complaint_id
      - name: priority
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
      - name: recommended_action
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - STANDARD_HANDLING
                  - PRIORITIZE_CASE_REVIEW
                  - ESCALATE_REVIEW
                  - INVESTIGATE_PATTERN
                  - REQUIRE_HUMAN_REVIEW
                  - UPDATE_AGENT_GUIDANCE
      - name: signal_confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HIGH", "MEDIUM", "LIMITED", "NOT_SUPPORTED"]
      - name: model_version
        tests: [not_null]
      - name: policy_version
        tests: [not_null]
      - name: generated_at
        tests: [not_null]

  - name: operations_overview_metrics
    description: >
      This is the curated, pre-aggregated surface I built so the app
      doesn't have to recompute distributions at read time — one row per
      metric date x dashboard dimension x metric name. I checked it against
      a fresh manual query straight against resolution_action_queue and
      fct_issue_daily_metrics to make sure the numbers actually reconcile.
      They do.
    columns:
      - name: metric_date
        tests: [not_null]
      - name: metric_name
        tests: [not_null]
