name: customer_resolution_intelligence
version: 1.1.0
config-version: 2

profile: customer_resolution_intelligence

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.8.0", "<2.0.0"]

# ---------------------------------------------------------------------------
# Materialization follows docs/05_architecture.md §5:
# views for simple staging; tables where dashboard performance justifies them.
# Incremental only when measured volume justifies it — not by default.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# NOTE ON SCHEMAS — deliberately no `+schema:` overrides.
#
# dbt's default generate_schema_name appends the custom schema to the target,
# producing ANALYTICS_PROD_operations, ANALYTICS_DEV_staging, and so on. Those
# are new schemas at the database level that the bootstrap grants do not cover,
# so CRI_APP_READER would hold read on an ANALYTICS_PROD containing nothing.
#
# Models therefore land directly in the target schema, matching the four-schema
# architecture in docs/05_architecture.md §4.
#
# This is safe for the app-read boundary because zip_code and tags are excluded
# downstream of RAW (docs/03_data_dictionary.md §4), so no sensitive field
# reaches ANALYTICS_PROD in the first place. The exclusion happens in the model
# layer, not at the grant layer.
# ---------------------------------------------------------------------------
models:
  customer_resolution_intelligence:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +tags: ["staging", "ci"]

    intermediate:
      +materialized: view
      +tags: ["intermediate"]

    marts:
      +materialized: table
      +tags: ["marts", "ci"]
      operations:
        +tags: ["critical"]
      agent_context:
        +tags: ["critical"]

# Seeds and test failures land in the target schema for the same reason models
# do — see the schema note above.
seeds:
  customer_resolution_intelligence:
    +tags: ["seeds", "ci"]
    priority_policy_thresholds:
      +column_types:
        policy_id: varchar
    accepted_values:
      +column_types:
        field_name: varchar
        accepted_value: varchar

tests:
  customer_resolution_intelligence:
    +store_failures: true

vars:
  # Retrieval surface determines date grain. Declare it; never mix surfaces.
  # See docs/02_data_provenance.md §10.1 (DQ-06).
  source_retrieval_surface: bulk_csv_archive

  # Publication-lag window. Set from measurement, not convention:
  # 33.94% of records 30-60 days old are still 'In progress'.
  # See docs/04_decisioning_policy.md §9.1.
  publication_lag_window_days: 60

  # ---------------------------------------------------------------------
  # Emerging-issue policy parameters. MUST match seeds/priority_policy_
  # thresholds.csv row POLICY_EMERGING_ISSUE. The seed is the audited,
  # human-readable policy record queried at run time by
  # int_priority_policy_application; these vars drive the SAME values
  # compiled into int_issue_trends.sql's window-frame INTERVAL clauses,
  # which must be Jinja-time constants, not a runtime seed lookup, because
  # a window frame's RANGE bound cannot reference a queried table value.
  # If you change one, change both, in the same pull request.
  # See docs/04_decisioning_policy.md §8.
  # ---------------------------------------------------------------------
  emerging_issue_current_window_days: 7
  emerging_issue_baseline_window_days: 30
  emerging_issue_min_current_volume: 20
  emerging_issue_min_baseline_volume: 50
  emerging_issue_min_pct_change: 0.30

  # Versioning for the recommendation contract (docs/04_decisioning_policy.md
  # §13). model_version tracks this dbt project; policy_version tracks
  # docs/04_decisioning_policy.md's own version header. Bump policy_version
  # whenever a policy rule, threshold, or precedence order changes, so a
  # past recommendation stays reproducible against the policy that produced it.
  model_version: '1.0.0'
  policy_version: '1.1.0'
