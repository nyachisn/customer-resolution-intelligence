# Copy to ~/.dbt/profiles.yml and fill in your own values.
# NEVER commit a real profiles.yml — it is git-ignored for a reason.
# Prefer key-pair authentication over a password.

customer_resolution_intelligence:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: CRI_TRANSFORMER
      warehouse: CRI_TRANSFORM_WH
      database: CUSTOMER_RESOLUTION_INTELLIGENCE
      schema: ANALYTICS_DEV
      threads: 4
      client_session_keep_alive: false

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: CRI_TRANSFORMER
      warehouse: CRI_TRANSFORM_WH
      database: CUSTOMER_RESOLUTION_INTELLIGENCE
      schema: ANALYTICS_PROD
      threads: 4
